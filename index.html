<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI-SRE学习仓库 | Fancy 的博客</title>

<style>
/* ===== 全局 ===== */
* {
  box-sizing: border-box;
}
html {
  scroll-behavior: smooth;
}
body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Helvetica Neue", sans-serif;
  background: url("images/bg.jpg") center/cover no-repeat fixed;
  color: #1d1d1f;
  transition: background 0.3s, color 0.2s;
}
body.dark {
  background: #1c1c1e url("images/bg.jpg") center/cover no-repeat fixed;
  color: #f5f5f7;
}
body.dark .post,
body.dark nav,
body.dark .modal-content,
body.dark .info-card {
  background: rgba(30,30,32,0.85);
  border-color: rgba(100,100,110,0.5);
  color: #f5f5f7;
}
body.dark .post p {
  color: #e5e5ea;
}
body.dark .post-meta {
  border-top-color: rgba(255,255,255,0.2);
}
body.dark header {
  background: linear-gradient(to bottom, rgba(0,0,0,0.7), rgba(0,0,0,0.4));
}
body.dark nav a {
  color: #f5f5f7;
}
body.dark .modal-content input,
body.dark .modal-content textarea {
  background: #2c2c2e;
  color: white;
  border-color: #555;
}
body.dark .delete-btn {
  background: rgba(255,100,100,0.2);
}
/* ===== Header ===== */
header {
  text-align: center;
  padding: 60px 20px 40px;
  background: linear-gradient(to bottom, rgba(255,255,255,0.65), rgba(255,255,255,0.35));
  backdrop-filter: blur(25px);
  transition: background 0.3s;
}
body.dark header {
  background: linear-gradient(to bottom, rgba(0,0,0,0.6), rgba(0,0,0,0.3));
}
header h1 {
  font-size: 48px;
  font-weight: 600;
  letter-spacing: -0.5px;
  margin-bottom: 15px;
}
header p {
  font-size: 18px;
  color: #3a3a3c;
}
body.dark header p {
  color: #ccc;
}
/* 导航 */
nav {
  position: sticky;
  top: 20px;
  margin: 0 auto 60px auto;
  width: fit-content;
  padding: 12px 30px;
  border-radius: 50px;
  display: flex;
  gap: 20px;
  background: rgba(255,255,255,0.75);
  backdrop-filter: blur(30px);
  box-shadow: 0 10px 40px rgba(0,0,0,0.08);
  z-index: 1000;
  transition: background 0.2s;
  flex-wrap: wrap;
  justify-content: center;
}
nav a, .nav-btn {
  text-decoration: none;
  color: #1d1d1f;
  font-size: 15px;
  font-weight: 500;
  transition: 0.3s ease;
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
}
nav a:hover, .nav-btn:hover {
  opacity: 0.5;
}
.theme-toggle {
  cursor: pointer;
  background: none;
  border: none;
  font-size: 18px;
  padding: 0 8px;
  font-weight: 500;
  color: inherit;
}
/* 文章卡片 */
.post {
  margin: 0 auto 40px auto;
  padding: 40px 50px;
  max-width: 800px;
  border-radius: 32px;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(40px);
  border: 1px solid rgba(255,255,255,0.9);
  box-shadow: 0 30px 70px rgba(0,0,0,0.08);
  transition: 0.3s ease;
}
.post:hover {
  transform: translateY(-5px);
}
.post h2 {
  margin-top: 0;
  font-size: 28px;
}
.post p {
  font-size: 17px;
  line-height: 1.8;
  color: #3a3a3c;
}
.post-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-wrap: wrap;
  gap: 15px;
  margin-top: 20px;
  border-top: 1px solid rgba(0,0,0,0.1);
  padding-top: 15px;
  font-size: 14px;
  color: #8e8e93;
}
.meta-left {
  display: flex;
  gap: 20px;
  align-items: baseline;
}
.read-count {
  cursor: pointer;
}
.read-count:hover {
  text-decoration: underline;
}
.post-actions {
  display: flex;
  gap: 12px;
}
.post-actions button {
  background: rgba(0,0,0,0.05);
  border: none;
  font-size: 14px;
  cursor: pointer;
  border-radius: 30px;
  padding: 6px 14px;
  backdrop-filter: blur(10px);
  transition: 0.2s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-weight: 500;
}
.post-actions button:hover {
  background: rgba(0,0,0,0.15);
}
body.dark .post-actions button {
  background: rgba(255,255,255,0.1);
  color: white;
}
.delete-btn {
  color: #ff3b30;
}
.delete-btn:hover {
  background: rgba(255,59,48,0.2);
}
/* 信息卡片（关于我、联系） */
.info-card {
  margin: 40px auto;
  padding: 40px 50px;
  max-width: 800px;
  border-radius: 32px;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(40px);
  border: 1px solid rgba(255,255,255,0.9);
  box-shadow: 0 30px 70px rgba(0,0,0,0.08);
}
.info-card h2 {
  margin-top: 0;
  font-size: 28px;
}
.info-card p {
  font-size: 17px;
  line-height: 1.8;
  color: #3a3a3c;
}
body.dark .info-card p {
  color: #e5e5ea;
}
/* 加载更多按钮 */
.load-more {
  display: block;
  margin: 20px auto 60px auto;
  padding: 12px 32px;
  background: rgba(255,255,255,0.9);
  border: none;
  border-radius: 40px;
  font-size: 16px;
  font-weight: 500;
  cursor: pointer;
  backdrop-filter: blur(10px);
  transition: 0.2s;
}
.load-more:hover {
  transform: scale(1.02);
  background: white;
}
body.dark .load-more {
  background: rgba(100,100,110,0.8);
  color: white;
}
/* 返回顶部 */
#backToTop {
  position: fixed;
  bottom: 30px;
  right: 30px;
  background: rgba(0,0,0,0.6);
  backdrop-filter: blur(8px);
  color: white;
  border: none;
  border-radius: 50%;
  width: 48px;
  height: 48px;
  font-size: 24px;
  cursor: pointer;
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 1000;
}
#backToTop:hover {
  background: black;
}
/* 模态框 */
.modal {
  display: none;
  position: fixed;
  z-index: 2000;
  left: 0;
  top: 0;
  width: 100%;
  height: 100%;
  background-color: rgba(0,0,0,0.6);
  backdrop-filter: blur(12px);
  align-items: center;
  justify-content: center;
}
.modal-content {
  background: rgba(255,255,255,0.95);
  backdrop-filter: blur(40px);
  margin: auto;
  padding: 30px 40px;
  border-radius: 32px;
  max-width: 600px;
  width: 90%;
  box-shadow: 0 30px 60px rgba(0,0,0,0.3);
  border: 1px solid rgba(255,255,255,0.9);
}
.modal-content h3 {
  margin-top: 0;
  font-size: 24px;
}
.modal-content input,
.modal-content textarea {
  width: 100%;
  padding: 12px;
  margin: 10px 0 20px;
  border-radius: 16px;
  border: 1px solid #ccc;
  background: rgba(255,255,255,0.9);
  font-family: inherit;
  font-size: 16px;
}
.modal-content textarea {
  min-height: 120px;
  resize: vertical;
}
.modal-buttons {
  display: flex;
  gap: 15px;
  justify-content: flex-end;
  margin-top: 10px;
}
.modal-buttons button {
  padding: 10px 24px;
  border-radius: 40px;
  border: none;
  cursor: pointer;
  font-weight: 500;
}
.save-btn {
  background: #0071e3;
  color: white;
}
.cancel-btn {
  background: #e5e5ea;
}
.delete-modal-btn {
  background: #ff3b30;
  color: white;
  margin-right: auto;
}
/* 打字动画 */
.typing {
  display: inline-block;
  overflow: hidden;
  white-space: nowrap;
  position: relative;
  animation: typing 2.5s steps(12, end) forwards;
}
@keyframes typing {
  from { width: 0; }
  to { width: 12ch; }
}
.typing::after {
  content: "";
  position: absolute;
  right: -5px;
  top: 15%;
  width: 2px;
  height: 70%;
  background: #1d1d1f;
  animation: blink 0.8s infinite;
}
@keyframes blink {
  50% { opacity: 0; }
}
@media (max-width: 600px) {
  .post {
    padding: 25px 20px;
  }
  .post-meta {
    flex-direction: column;
    align-items: flex-start;
  }
  .post-actions {
    align-self: flex-end;
  }
}
</style>
</head>

<body>

<header>
  <h1 class="typing">Fancy 的博客</h1>
  <p>记录学习与成长 ✨</p>
</header>

<nav>
  <a href="#" id="navHome">首页</a>
  <a href="#" id="navAbout">关于我</a>
  <a href="#" id="navArticles">文章</a>
  <a href="#" id="navContact">联系</a>
  <button class="nav-btn" id="newPostBtn">➕ 新建文章</button>
  <button class="theme-toggle" id="themeToggle">🌙 暗色</button>
</nav>

<div id="postsContainer"></div>

<button id="loadMoreBtn" class="load-more">加载更多</button>

<!-- 关于我区域 -->
<div id="about" class="info-card">
  <h2>📖 关于我</h2>
  <p>大家好，我是 Fancy，一名热爱技术的 SRE 工程师。喜欢研究自动化运维、云原生架构和 AI 赋能。这个博客用来记录学习笔记、技术思考和生活感悟。欢迎交流！</p>
  <p>GitHub: <a href="#" style="color: #0071e3;">github.com/fancy</a> (示例)</p>
</div>

<!-- 联系区域 -->
<div id="contact" class="info-card">
  <h2>📧 联系我</h2>
  <p>如果你有任何问题或建议，可以通过以下方式联系我：</p>
  <p>📮 邮箱: fancy@example.com</p>
  <p>💬 微信: fancy_wechat (示例)</p>
  <p>🐦 Twitter: @fancy_dev</p>
</div>

<button id="backToTop">↑</button>

<!-- 编辑/新建模态框 -->
<div id="editModal" class="modal">
  <div class="modal-content">
    <h3 id="modalTitle">编辑文章</h3>
    <label>标题</label>
    <input type="text" id="editTitle" placeholder="标题">
    <label>内容</label>
    <textarea id="editContent" placeholder="文章内容"></textarea>
    <label>日期</label>
    <input type="date" id="editDate">
    <div class="modal-buttons">
      <button class="delete-modal-btn" id="deleteArticleBtn" style="display: none;">删除</button>
      <button class="cancel-btn" id="cancelEditBtn">取消</button>
      <button class="save-btn" id="saveEditBtn">保存</button>
    </div>
  </div>
</div>

<script>
  // ---------- 文章数据 ----------
  let totalArticles = [];
  let currentPage = 1;
  const pageSize = 3;

  // 预设初始文章
  const defaultArticles = [
    { id: 1, title: "我的第一篇文章", content: "这是我的博客正式上线啦！以后会在这里记录学习前端和技术的过程。", date: "2025-04-01", views: 128 },
    { id: 2, title: "Ansible 学习笔记 - 循环字典", content: "在Ansible中，dict2items可以方便遍历字典，结合loop使用。", date: "2025-04-15", views: 86 },
    { id: 3, title: "SRE 的北极星指标", content: "SLO（服务水平目标）是SRE的核心指标，直接反映用户对系统稳定性的感知。", date: "2025-04-20", views: 203 },
    { id: 4, title: "Ubuntu 静态IP配置", content: "使用netplan轻松设置固定IP，别忘了apply。", date: "2025-04-22", views: 55 },
    { id: 5, title: "使用 Ansible 管理 NFS", content: "通过mount模块批量挂载，并通过lineinfile配置/etc/fstab。", date: "2025-04-25", views: 42 }
  ];
  const moreArticles = [
    { id: 6, title: "一文读懂 when 语句", content: "Ansible中when用于条件判断，支持多种表达式。", date: "2025-04-26", views: 31 },
    { id: 7, title: "注册变量和 changed 判断", content: "register 捕获任务输出，通过when结合changed做条件触发。", date: "2025-04-27", views: 27 },
    { id: 8, title: "Prometheus 监控入门", content: "拉取指标，配置告警，Grafana可视化。", date: "2025-04-28", views: 64 }
  ];

  // ---------- localStorage 操作 ----------
  function loadDataFromStorage() {
    const stored = localStorage.getItem('blog_articles');
    if (stored) {
      totalArticles = JSON.parse(stored);
    } else {
      totalArticles = [...defaultArticles];
      const existIds = new Set(totalArticles.map(a => a.id));
      for (let art of moreArticles) {
        if (!existIds.has(art.id)) totalArticles.push(art);
      }
    }
    totalArticles = totalArticles.map(a => ({ ...a, views: a.views || 0 }));
  }

  function saveArticlesToStorage() {
    localStorage.setItem('blog_articles', JSON.stringify(totalArticles));
  }

  // ---------- 后端同步模拟 ----------
  const API_BASE = 'https://jsonplaceholder.typicode.com/posts';
  async function syncToBackend(action, article) {
    let url = API_BASE;
    let options = {};
    switch (action) {
      case 'create':
        options = {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: article.title, body: article.content, userId: 1 })
        };
        break;
      case 'update':
        options = {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ id: article.id, title: article.title, body: article.content })
        };
        url += `/${article.id}`;
        break;
      case 'delete':
        options = { method: 'DELETE' };
        url += `/${article.id}`;
        break;
      default: return;
    }
    try {
      const response = await fetch(url, options);
      const data = await response.json();
      console.log(`[后端同步] ${action} 成功:`, data);
    } catch (err) {
      console.error(`[后端同步] ${action} 失败:`, err);
    }
  }

  function notifyBackend(action, article) {
    syncToBackend(action, article);
  }

  // ---------- CRUD ----------
  function generateNewId() {
    const maxId = totalArticles.length > 0 ? Math.max(...totalArticles.map(a => a.id)) : 0;
    return maxId + 1;
  }

  function createArticle(title, content, date) {
    const newId = generateNewId();
    const newArticle = {
      id: newId,
      title: title,
      content: content,
      date: date || new Date().toISOString().slice(0,10),
      views: 0
    };
    totalArticles.unshift(newArticle);
    saveArticlesToStorage();
    notifyBackend('create', newArticle);
    currentPage = 1;
    renderArticles();
  }

  function updateArticle(id, title, content, date) {
    const index = totalArticles.findIndex(a => a.id === id);
    if (index !== -1) {
      totalArticles[index].title = title;
      totalArticles[index].content = content;
      totalArticles[index].date = date;
      saveArticlesToStorage();
      notifyBackend('update', totalArticles[index]);
      renderArticles();
    }
  }

  function deleteArticle(id) {
    if (!confirm("确定要删除这篇文章吗？")) return;
    const article = totalArticles.find(a => a.id === id);
    if (!article) return;
    totalArticles = totalArticles.filter(a => a.id !== id);
    saveArticlesToStorage();
    notifyBackend('delete', article);
    if (totalArticles.length <= (currentPage-1)*pageSize && currentPage > 1) {
      currentPage--;
    }
    renderArticles();
  }

  function incrementView(articleId) {
    const article = totalArticles.find(a => a.id === articleId);
    if (article) {
      article.views += 1;
      saveArticlesToStorage();
      renderArticles();
    }
  }

  // ---------- 渲染分页 ----------
  function renderArticles() {
    const start = (currentPage - 1) * pageSize;
    const pageArticles = totalArticles.slice(start, start + pageSize);
    const container = document.getElementById('postsContainer');
    if (!container) return;
    if (totalArticles.length === 0) {
      container.innerHTML = '<div style="text-align:center; padding:60px;">暂无文章，点击「新建文章」开始创作 ✍️</div>';
      document.getElementById('loadMoreBtn').style.display = 'none';
      return;
    }
    if (pageArticles.length === 0 && currentPage > 1) {
      currentPage--;
      return renderArticles();
    }

    let html = '';
    for (let art of pageArticles) {
      html += `
        <section class="post">
          <h2>${escapeHtml(art.title)}</h2>
          <p>${escapeHtml(art.content)}</p>
          <div class="post-meta">
            <div class="meta-left">
              <span>📅 ${art.date}</span>
              <span class="read-count" data-id="${art.id}">👀 ${art.views} 次阅读</span>
            </div>
            <div class="post-actions">
              <button class="edit-btn" data-id="${art.id}">✏️ 编辑</button>
              <button class="delete-btn" data-id="${art.id}">🗑️ 删除</button>
            </div>
          </div>
        </section>
      `;
    }
    container.innerHTML = html;

    // 绑定事件
    document.querySelectorAll('.edit-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const id = parseInt(btn.getAttribute('data-id'));
        openEditModal(id);
      });
    });
    document.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const id = parseInt(btn.getAttribute('data-id'));
        deleteArticle(id);
      });
    });
    document.querySelectorAll('.read-count').forEach(el => {
      el.addEventListener('click', (e) => {
        const id = parseInt(el.getAttribute('data-id'));
        incrementView(id);
      });
    });

    const loadMoreBtn = document.getElementById('loadMoreBtn');
    if (totalArticles.length <= currentPage * pageSize) {
      loadMoreBtn.style.display = 'none';
    } else {
      loadMoreBtn.style.display = 'block';
    }
  }

  function loadMore() {
    currentPage++;
    renderArticles();
  }

  // ---------- 模态框逻辑 ----------
  let editingId = null;

  function openEditModal(id = null) {
    editingId = id;
    const modal = document.getElementById('editModal');
    const modalTitle = document.getElementById('modalTitle');
    const deleteBtn = document.getElementById('deleteArticleBtn');
    if (id === null) {
      modalTitle.innerText = '新建文章';
      deleteBtn.style.display = 'none';
      document.getElementById('editTitle').value = '';
      document.getElementById('editContent').value = '';
      document.getElementById('editDate').value = new Date().toISOString().slice(0,10);
    } else {
      modalTitle.innerText = '编辑文章';
      deleteBtn.style.display = 'block';
      const article = totalArticles.find(a => a.id === id);
      if (article) {
        document.getElementById('editTitle').value = article.title;
        document.getElementById('editContent').value = article.content;
        document.getElementById('editDate').value = article.date;
      }
    }
    modal.style.display = 'flex';
  }

  function closeEditModal() {
    document.getElementById('editModal').style.display = 'none';
    editingId = null;
  }

  function saveEdit() {
    const title = document.getElementById('editTitle').value.trim();
    const content = document.getElementById('editContent').value.trim();
    const date = document.getElementById('editDate').value;
    if (!title || !content) {
      alert('标题和内容不能为空');
      return;
    }
    if (editingId === null) {
      createArticle(title, content, date);
    } else {
      updateArticle(editingId, title, content, date);
    }
    closeEditModal();
  }

  function handleDeleteFromModal() {
    if (editingId !== null) {
      deleteArticle(editingId);
      closeEditModal();
    }
  }

  // ---------- 导航跳转功能 ----------
  function setupNavigation() {
    const homeLink = document.getElementById('navHome');
    const aboutLink = document.getElementById('navAbout');
    const articlesLink = document.getElementById('navArticles');
    const contactLink = document.getElementById('navContact');

    homeLink.addEventListener('click', (e) => {
      e.preventDefault();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    });

    aboutLink.addEventListener('click', (e) => {
      e.preventDefault();
      document.getElementById('about').scrollIntoView({ behavior: 'smooth' });
    });

    articlesLink.addEventListener('click', (e) => {
      e.preventDefault();
      const postsContainer = document.getElementById('postsContainer');
      if (postsContainer) {
        postsContainer.scrollIntoView({ behavior: 'smooth' });
      }
    });

    contactLink.addEventListener('click', (e) => {
      e.preventDefault();
      document.getElementById('contact').scrollIntoView({ behavior: 'smooth' });
    });
  }

  // ---------- 暗色模式 ----------
  function initDarkMode() {
    const darkMode = localStorage.getItem('darkMode') === 'true';
    if (darkMode) {
      document.body.classList.add('dark');
      document.getElementById('themeToggle').innerHTML = '☀️ 亮色';
    } else {
      document.body.classList.remove('dark');
      document.getElementById('themeToggle').innerHTML = '🌙 暗色';
    }
  }
  function toggleDarkMode() {
    if (document.body.classList.contains('dark')) {
      document.body.classList.remove('dark');
      localStorage.setItem('darkMode', 'false');
      document.getElementById('themeToggle').innerHTML = '🌙 暗色';
    } else {
      document.body.classList.add('dark');
      localStorage.setItem('darkMode', 'true');
      document.getElementById('themeToggle').innerHTML = '☀️ 亮色';
    }
  }

  // ---------- 返回顶部 ----------
  function handleScroll() {
    const btn = document.getElementById('backToTop');
    if (window.scrollY > 300) btn.style.display = 'flex';
    else btn.style.display = 'none';
  }
  function scrollToTop() {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  // ---------- 初始化 ----------
  function init() {
    loadDataFromStorage();
    renderArticles();
    initDarkMode();
    setupNavigation();
    window.addEventListener('scroll', handleScroll);
    document.getElementById('loadMoreBtn').addEventListener('click', loadMore);
    document.getElementById('backToTop').addEventListener('click', scrollToTop);
    document.getElementById('themeToggle').addEventListener('click', toggleDarkMode);
    document.getElementById('newPostBtn').addEventListener('click', () => openEditModal(null));
    document.getElementById('cancelEditBtn').addEventListener('click', closeEditModal);
    document.getElementById('saveEditBtn').addEventListener('click', saveEdit);
    document.getElementById('deleteArticleBtn').addEventListener('click', handleDeleteFromModal);
    document.getElementById('editModal').addEventListener('click', (e) => {
      if (e.target === document.getElementById('editModal')) closeEditModal();
    });
  }

  function escapeHtml(str) {
    return str.replace(/[&<>]/g, function(m) {
      if (m === '&') return '&amp;';
      if (m === '<') return '&lt;';
      if (m === '>') return '&gt;';
      return m;
    });
  }

  init();
</script>
</body>
</html>
