<html lang="zh">
<head>

<style>
/* ========== 所有样式与之前相同（为节省篇幅此处保持精简，实际完整样式参考之前） ========== */

}
html {

}

}

}

}
header {
  text-align: center;
  padding: 60px 20px 40px;

nav {

.language-detection {

.modal-buttons {
  display: flex;

}

.typing {

<body>

<header>

<div class="stats-card">

<script>
  // ---------- 语言检测函数 ----------
  function detectLanguage(text) {
    if (!text.trim()) return "未知";
    const lower = text.toLowerCase();
    // Python
    if (/def\s+\w+\s*\(|import\s+\w+|from\s+\w+\s+import|print\s*\(|class\s+\w+.*:/m.test(lower)) return "Python";
    // JavaScript / TypeScript
    if (/function\s*\(|const\s+\w+\s*=\s*\(|let\s+\w+\s*=|=>\s*{|console\.log|document\.|window\./m.test(lower)) return "JavaScript";
    // Java
    if (/public\s+class|System\.out\.println|private\s+static|void\s+main\s*\(/m.test(lower)) return "Java";
    // C / C++
    if (/#include\s*[<"]|int\s+main\s*\(|printf\s*\(|scanf\s*\(|std::cout/m.test(lower)) return "C/C++";
    // Go
    if (/package\s+main|func\s+main\s*\(|fmt\.Println|import\s*\(/m.test(lower)) return "Go";
    // Ruby
    if (/def\s+\w+\s*\n|puts\s+["']|require\s+['"]|attr_accessor/m.test(lower)) return "Ruby";
    // PHP
    if (/<\?php|echo\s+["']|\$_GET|\$_POST/m.test(lower)) return "PHP";
    // HTML/XML
    if (/<(!DOCTYPE|html|head|body|div|span|p|a)[> ]/i.test(text)) return "HTML";
    // YAML
    if (/^[\w-]+:\s|^\s+-\s+[\w-]+:/m.test(text)) return "YAML";
    // JSON
    if (/^\s*\{\s*".*"\s*:/m.test(text) || /^\s*\[\s*\{/m.test(text)) return "JSON";
    // Shell / Bash
    if (/^#!\/bin\/bash|^#!\/bin\/sh|echo\s+["']|\$\(\(|if\s+\[/m.test(lower)) return "Shell";
    // SQL
    if (/select\s+.*\s+from|insert\s+into|update\s+\w+\s+set|create\s+table/m.test(lower)) return "SQL";
    // 默认
    return "纯文本";
  }

  // ---------- 文章数据结构与本地存储 ----------
  let totalArticles = [];
  let currentPage = 1;
  const pageSize = 5;
  let currentSort = 'created_desc';

  const defaultArticles = [
    { id: 1, title: "我的第一篇文章", content: "这是我的博客正式上线啦！以后会在这里记录学习前端和技术的过程。", date: "2025-04-01", views: 128, createdAt: 1743494400000, updatedAt: 1743494400000 },
    { id: 2, title: "Ansible 学习笔记 - 循环字典", content: "在Ansible中，dict2items可以方便遍历字典，结合loop使用。", date: "2025-04-15", views: 86, createdAt: 1744704000000, updatedAt: 1744704000000 },
    { id: 3, title: "SRE 的北极星指标", content: "SLO（服务水平目标）是SRE的核心指标，直接反映用户对系统稳定性的感知。", date: "2025-04-20", views: 203, createdAt: 1745193600000, updatedAt: 1745193600000 },
    { id: 4, title: "Ubuntu 静态IP配置", content: "使用netplan轻松设置固定IP，别忘了apply。", date: "2025-04-22", views: 55, createdAt: 1745366400000, updatedAt: 1745366400000 },
    { id: 5, title: "使用 Ansible 管理 NFS", content: "通过mount模块批量挂载，并通过lineinfile配置/etc/fstab。", date: "2025-04-25", views: 42, createdAt: 1745625600000, updatedAt: 1745625600000 }
  ];
  const moreArticles = [
    { id: 6, title: "一文读懂 when 语句", content: "Ansible中when用于条件判断，支持多种表达式。", date: "2025-04-26", views: 31, createdAt: 1745712000000, updatedAt: 1745712000000 },
    { id: 7, title: "注册变量和 changed 判断", content: "register 捕获任务输出，通过when结合changed做条件触发。", date: "2025-04-27", views: 27, createdAt: 1745798400000, updatedAt: 1745798400000 },
    { id: 8, title: "Prometheus 监控入门", content: "拉取指标，配置告警，Grafana可视化。", date: "2025-04-28", views: 64, createdAt: 1745884800000, updatedAt: 1745884800000 }
  ];

  function countWords(text) { return text.replace(/\s+/g, '').length; }
  function updateStats() {
    document.getElementById('totalArticlesCount').innerText = totalArticles.length;
    const totalWords = totalArticles.reduce((sum, art) => sum + countWords(art.content), 0);
    document.getElementById('totalWordsCount').innerText = totalWords;
  }

  function loadDataFromStorage() {
    const stored = localStorage.getItem('blog_articles');
    if (stored) totalArticles = JSON.parse(stored);
    else {
      totalArticles = [...defaultArticles];
      const existIds = new Set(totalArticles.map(a=>a.id));
      for (let art of moreArticles) if (!existIds.has(art.id)) totalArticles.push(art);
    }
    let needSave = false;
    totalArticles = totalArticles.map(art => {
      let updated = art;
      if (!art.createdAt) {
        needSave = true;
        let ts = Date.parse(art.date);
        if (isNaN(ts)) ts = 1743000000000 + art.id*86400000;
        updated.createdAt = ts;
      }
      if (!art.updatedAt) { needSave = true; updated.updatedAt = updated.createdAt; }
      if (art.views === undefined) { needSave = true; updated.views = 0; }
      return updated;
    });
    if (needSave) saveArticlesToStorage();
    updateStats();
  }
  function saveArticlesToStorage() { localStorage.setItem('blog_articles', JSON.stringify(totalArticles)); updateStats(); }

  function sortArticles() {
    if (currentSort === 'created_desc') totalArticles.sort((a,b)=>b.createdAt - a.createdAt);
    else if (currentSort === 'created_asc') totalArticles.sort((a,b)=>a.createdAt - b.createdAt);
    else if (currentSort === 'updated_desc') totalArticles.sort((a,b)=>b.updatedAt - a.updatedAt);
  }

  function renderArticles() {
    sortArticles();
    const start = (currentPage-1)*pageSize;
    const pageArticles = totalArticles.slice(start, start+pageSize);
    const container = document.getElementById('postsContainer');
    if (!container) return;
    if (totalArticles.length === 0) {
      container.innerHTML = '<div style="text-align:center;padding:60px;">暂无文章，点击「新建文章」开始创作 ✍️</div>';
      document.getElementById('paginationContainer').innerHTML = '';
      return;
    }
    let html = '';
    for (let art of pageArticles) {
      const wc = countWords(art.content);
      html += `
        <section class="post">
          <h2>${escapeHtml(art.title)}</h2>
          <p>${escapeHtml(art.content)}</p>
          <div class="post-meta">
            <div class="meta-left">
              <span>📅 ${art.date}</span>
              <span class="read-count" data-id="${art.id}">👀 ${art.views} 次阅读</span>
              <span>📝 ${wc} 字</span>
            </div>
            <div class="post-actions">
              <button class="edit-btn" data-id="${art.id}">✏️ 编辑</button>
              <button class="delete-btn" data-id="${art.id}">🗑️ 删除</button>
            </div>
          </div>
        </section>
      `;
    }
    container.innerHTML = html;
    document.querySelectorAll('.edit-btn').forEach(btn=>btn.addEventListener('click',()=>openEditModal(parseInt(btn.dataset.id))));
    document.querySelectorAll('.delete-btn').forEach(btn=>btn.addEventListener('click',()=>deleteArticle(parseInt(btn.dataset.id))));
    document.querySelectorAll('.read-count').forEach(el=>el.addEventListener('click',()=>incrementView(parseInt(el.dataset.id))));
    renderPagination();
  }

  function renderPagination() {
    const totalPages = Math.ceil(totalArticles.length/pageSize);
    const container = document.getElementById('paginationContainer');
    if (totalPages<=1) { container.innerHTML = ''; return; }
    let html = '';
    if (currentPage>1) html += `<button class="page-btn" data-page="${currentPage-1}">← 上一页</button>`;
    for (let i=1;i<=totalPages;i++) html += `<button class="page-btn ${i===currentPage?'active':''}" data-page="${i}">${i}</button>`;
    if (currentPage<totalPages) html += `<button class="page-btn" data-page="${currentPage+1}">下一页 →</button>`;
    container.innerHTML = html;
    container.querySelectorAll('.page-btn').forEach(btn=>btn.addEventListener('click',()=>{
      const page = parseInt(btn.dataset.page);
      if (!isNaN(page) && page!==currentPage) { currentPage=page; renderArticles(); document.getElementById('postsContainer').scrollIntoView({behavior:'smooth'}); }
    }));
  }

  function adjustPageAfterDataChange() {
    const totalPages = Math.ceil(totalArticles.length/pageSize);
    if (totalPages===0) currentPage=1;
    else if (currentPage>totalPages) currentPage=totalPages;
  }

  function generateNewId() { return totalArticles.length>0 ? Math.max(...totalArticles.map(a=>a.id))+1 : 1; }

  function createArticle(title,content,date){
    const now = Date.now();
    const newId = generateNewId();
    const newArticle = { id:newId, title, content, date:date||new Date().toISOString().slice(0,10), views:0, createdAt:now, updatedAt:now };
    totalArticles.push(newArticle);
    sortArticles();
    adjustPageAfterDataChange();
    renderArticles();
    saveArticlesToStorage();
    notifyBackend('create',newArticle);
  }

  function updateArticle(id,title,content,date){
    const idx = totalArticles.findIndex(a=>a.id===id);
    if (idx!==-1) {
      totalArticles[idx].title = title;
      totalArticles[idx].content = content;
      totalArticles[idx].date = date;
      totalArticles[idx].updatedAt = Date.now();
      saveArticlesToStorage();
      notifyBackend('update',totalArticles[idx]);
      sortArticles();
      renderArticles();
    }
  }

  function deleteArticle(id){
    if (!confirm("确定要删除这篇文章吗？")) return;
    totalArticles = totalArticles.filter(a=>a.id!==id);
    saveArticlesToStorage();
    notifyBackend('delete',{id});
    adjustPageAfterDataChange();
    renderArticles();
  }

  function incrementView(id){
    const article = totalArticles.find(a=>a.id===id);
    if (article) { article.views++; saveArticlesToStorage(); renderArticles(); }
  }

  let editingId = null;
  function openEditModal(id=null){
    editingId = id;
    const modal = document.getElementById('editModal');
    const modalTitle = document.getElementById('modalTitle');
    const deleteBtn = document.getElementById('deleteArticleBtn');
    const contentTextarea = document.getElementById('editContent');
    if (id===null) {
      modalTitle.innerText = '新建文章';
      deleteBtn.style.display = 'none';
      document.getElementById('editTitle').value = '';
      contentTextarea.value = '';
      document.getElementById('editDate').value = new Date().toISOString().slice(0,10);
    } else {
      modalTitle.innerText = '编辑文章';
      deleteBtn.style.display = 'block';
      const article = totalArticles.find(a=>a.id===id);
      if (article) {
        document.getElementById('editTitle').value = article.title;
        contentTextarea.value = article.content;
        document.getElementById('editDate').value = article.date;
      }
    }
    // 初始语言检测
    updateLanguageHint(contentTextarea.value);
    modal.style.display = 'flex';
  }

  function updateLanguageHint(text){
    const lang = detectLanguage(text);
    document.getElementById('languageHint').innerHTML = `🔍 检测到代码类型：${lang}`;
  }

  function closeEditModal(){
    document.getElementById('editModal').style.display = 'none';
    editingId = null;
  }

  function saveEdit(){
    const title = document.getElementById('editTitle').value.trim();
    const content = document.getElementById('editContent').value;
    const date = document.getElementById('editDate').value;
    if (!title || !content) { alert('标题和内容不能为空'); return; }
    if (editingId===null) createArticle(title,content,date);
    else updateArticle(editingId,title,content,date);
    closeEditModal();
  }

  function handleDeleteFromModal(){
    if (editingId!==null){ deleteArticle(editingId); closeEditModal(); }
  }

  // 后端模拟同步（可选）
  const API_BASE = 'https://jsonplaceholder.typicode.com/posts';
  async function syncToBackend(action,article){
    let url = API_BASE;
    let options = {};
    switch(action){
      case 'create': options={method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({title:article.title,body:article.content,userId:1})}; break;
      case 'update': options={method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:article.id,title:article.title,body:article.content})}; url+=`/${article.id}`; break;
      case 'delete': options={method:'DELETE'}; url+=`/${article.id}`; break;
      default: return;
    }
    try{ await fetch(url,options); console.log(`[后端同步] ${action} 成功`); } catch(err){ console.error(`[后端同步] ${action} 失败`,err); }
  }
  function notifyBackend(action,article){ if(['create','update','delete'].includes(action)) syncToBackend(action,article); }

  // 导航、暗色模式、滚动等辅助函数
  function setupNavigation(){
    document.getElementById('navHome').addEventListener('click',(e)=>{e.preventDefault(); window.scrollTo({top:0,behavior:'smooth'});});
    document.getElementById('navAbout').addEventListener('click',(e)=>{e.preventDefault(); document.getElementById('about').scrollIntoView({behavior:'smooth'});});
    document.getElementById('navArticles').addEventListener('click',(e)=>{e.preventDefault(); document.getElementById('postsContainer').scrollIntoView({behavior:'smooth'});});
    document.getElementById('navContact').addEventListener('click',(e)=>{e.preventDefault(); document.getElementById('contact').scrollIntoView({behavior:'smooth'});});
  }
  function initDarkMode(){
    const dark = localStorage.getItem('darkMode')==='true';
    if(dark){ document.body.classList.add('dark'); document.getElementById('themeToggle').innerHTML='☀️ 亮色'; }
    else{ document.body.classList.remove('dark'); document.getElementById('themeToggle').innerHTML='🌙 暗色'; }
  }
  function toggleDarkMode(){
    if(document.body.classList.contains('dark')){
      document.body.classList.remove('dark');
      localStorage.setItem('darkMode','false');
      document.getElementById('themeToggle').innerHTML='🌙 暗色';
    } else {
      document.body.classList.add('dark');
      localStorage.setItem('darkMode','true');
      document.getElementById('themeToggle').innerHTML='☀️ 亮色';
    }
  }
  function handleScroll(){ const btn=document.getElementById('backToTop'); if(window.scrollY>300) btn.style.display='flex'; else btn.style.display='none'; }
  function scrollToTop(){ window.scrollTo({top:0,behavior:'smooth'}); }
  function escapeHtml(str){ return str.replace(/[&<>]/g,function(m){ if(m==='&') return '&amp;'; if(m==='<') return '&lt;'; if(m==='>') return '&gt;'; return m; }); }
  function changeSort(value){ currentSort=value; currentPage=1; sortArticles(); renderArticles(); }

  function init(){
    loadDataFromStorage();
    sortArticles();
    adjustPageAfterDataChange();
    renderArticles();
    initDarkMode();
    setupNavigation();
    window.addEventListener('scroll',handleScroll);
    document.getElementById('backToTop').addEventListener('click',scrollToTop);
    document.getElementById('themeToggle').addEventListener('click',toggleDarkMode);
    document.getElementById('newPostBtn').addEventListener('click',()=>openEditModal(null));
    document.getElementById('cancelEditBtn').addEventListener('click',closeEditModal);
    document.getElementById('saveEditBtn').addEventListener('click',saveEdit);
    document.getElementById('deleteArticleBtn').addEventListener('click',handleDeleteFromModal);
    document.getElementById('editModal').addEventListener('click',(e)=>{ if(e.target===document.getElementById('editModal')) closeEditModal(); });
    const contentTextarea = document.getElementById('editContent');
    contentTextarea.addEventListener('input', (e) => updateLanguageHint(e.target.value));
    document.getElementById('sortSelect').value = currentSort;
    document.getElementById('sortSelect').addEventListener('change',(e)=>changeSort(e.target.value));
  }
  init();
</script>
</body>
</html>
